{%- comment -%}
  Anchor links point at the home page so they work from /publications/ and /cv/ too.
{%- endcomment -%}
<header class="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="{{ '/' | relative_url }}">
      <span class="nav__brand-mark" aria-hidden="true"></span>
      {{ site.name }}
    </a>

    <input type="checkbox" id="nav-toggle" class="nav__checkbox" aria-hidden="true">
    <label for="nav-toggle" class="nav__burger" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </label>

    <nav class="nav__links" aria-label="Primary">
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
      <a href="{{ '/cv/' | relative_url }}">CV</a>
      {%- if site.email and site.email != "" -%}
      <a href="mailto:{{ site.email }}">Contact</a>
      {%- endif -%}
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var root = document.documentElement;
    btn.addEventListener('click', function () {
      var now = root.getAttribute('data-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = now === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
